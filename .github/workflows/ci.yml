name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test branch-name script
        run: make test-scripts
      - name: Check Conventional Branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }} # via env, never inline, to avoid script injection
        run: scripts/check-branch-name.sh "$HEAD_REF"

  # Lint and vet only: the integration job runs every unit test too, as
  # -tags=integration adds files without leaving any out.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # setup-go's cache has one key for every job, so whichever job saves first wins; see below
      # This job's own Go cache: modules and compiled packages. PRs restore the
      # newest one main saved, and only main saves, so PR pushes don't fill the
      # repo's cache space. Go recompiles only what changed since.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0 # keep in step with local `golangci-lint version`; must be built with Go >= go.mod's version
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the breaking-change check compares with origin/main
      - uses: actions/setup-go@v6 # make proto-check generates with the protoc-gen-go pinned in go.mod
        with:
          go-version-file: go.mod
      - name: Install buf # downloads the release binary, rather than compiling buf from source
        uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0 # keep in step with local `buf --version`
          setup_only: true # just install buf: make proto-check runs the checks
      - name: Check contracts (format, lint, breaking changes, generated Go up to date)
        run: make proto-check PROTO_AGAINST=origin/main

  integration:
    runs-on: ubuntu-latest # has Docker, which testcontainers needs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v6 # this job's own Go cache, as in the go job
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-
      - name: Unit and integration tests (real Postgres in Docker)
        run: make test-integration
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image and smoke-test it
        run: make docker-smoke

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1 # keep in step with local `helm version`
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: Lint chart and validate manifests
        run: make chart-check
      - name: Validate Grafana dashboards
        run: make dashboards-check
