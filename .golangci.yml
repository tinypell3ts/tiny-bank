# golangci-lint v2 config. Start small and add linters when they catch real problems.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTP response bodies must be closed
    - errorlint # use errors.Is/As, wrap with %w
    - gosec # common security mistakes
    - misspell
    - noctx # outbound HTTP requests must carry a context
    - unconvert # pointless type conversions

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tinypell3ts/tiny-bank
