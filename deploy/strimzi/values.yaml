# Strimzi operator settings for the LOCAL kind cluster.
# Installed by `make strimzi` (and by `make dev` through the Tiltfile).
# The chart version is pinned in the Makefile (STRIMZI_CHART_VERSION).
#
# The operator only watches for Strimzi objects (a `Kafka`, its
# `KafkaNodePool`s, `KafkaTopic`s) and runs Kafka for them: the brokers, their
# storage, their config, rolling restarts and upgrades. It's to Kafka what
# CloudNativePG is to Postgres. Strimzi 1.x runs Kafka in KRaft mode only, so
# there's no ZooKeeper.
#
# It's installed in the `kafka` namespace and, with watchNamespaces empty,
# watches only that one: the Kafka cluster lives there too.
#
# The chart's own pod settings already match ours: non-root, a read-only root
# filesystem, no privilege escalation, all capabilities dropped and the
# default seccomp profile, so they aren't repeated here.

watchNamespaces: []

# No leader election: it lets several replicas share the work, one at a time,
# but this operator runs one replica, so it protects nothing. And it costs
# restarts: when the lease can't be renewed in time (the laptop sleeps, or the
# API server is slow to answer), the operator exits by design, which here
# meant dozens of restarts a day. A production operator with more than one
# replica keeps it on.
leaderElection:
  enable: false

# Without leader election, two operators running at once would both act on
# the same Kafka. By default an update starts the new pod before stopping the
# old one, so stop the old one first instead.
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Give every pod Strimzi runs (brokers, the topic operator) the Kubernetes
# "restricted" security settings: non-root, no privilege escalation, all
# capabilities dropped, the default seccomp profile, as our own pods have.
extraEnvs:
  - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
    value: restricted

# The chart's defaults (384Mi, request 200m CPU) suit one small cluster.
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 384Mi
