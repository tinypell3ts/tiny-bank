# transaction's settings for the generic chart (deploy/charts/service).
name: transaction
image:
  repository: tiny-bank/transaction
# Its own Postgres, run by CloudNativePG: the chart creates transaction-db and
# passes DATABASE_URL to the service from the secret the operator generates.
database:
  enabled: true
config:
  # Where the ledger is: its Service's name, on port 80. Every transfer is
  # posted to it.
  LEDGER_URL: http://ledger
  # Where Kafka is (make kafka; make dev runs it first): the transaction
  # service sends its events to it, through its outbox.
  KAFKA_BROKERS: tiny-bank-kafka-bootstrap.kafka:9092
