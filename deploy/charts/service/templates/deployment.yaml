# Keeps `replicas` copies of the pod running, replacing any that die or fail liveness,
# and rolls out new versions without downtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.labels" . | nindent 8 }}
      annotations:
        # Env comes from the ConfigMap only at pod start, so roll the pods when it changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false # our services don't call the Kubernetes API
      terminationGracePeriodSeconds: {{ add .Values.preStopSleepSeconds .Values.shutdownTimeoutSeconds 5 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "service.name" . }}
          image: "{{ required "values: image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          envFrom:
            - configMapRef:
                name: {{ include "service.name" . }}
          {{- if .Values.database.enabled }}
          env:
            # A postgresql:// URL with host, port, user, password and database,
            # generated by CloudNativePG. The pod waits to start until the secret exists.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "service.dbName" . }}-app
                  key: uri
          {{- end }}
          # Startup: until this passes, Kubernetes runs no liveness or readiness
          # checks, so a slow start isn't mistaken for a hung process. A service
          # with a database connects and migrates before it listens, which can
          # take about a minute on a brand-new database. 30 x 5s = 150s, longer
          # than the services' 2-minute startup timeout. Fast services pass on
          # the first check.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Liveness: is the process alive? Failing restarts the container.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: should it get traffic? Failing removes it from the Service, no restart.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              # Built-in sleep action: distroless images have no `sleep` binary.
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
